<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1 ANI - Anıları Keşfet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #ffffff 0%, transparent 35%),
                linear-gradient(135deg, #f5f7ff, #e9ecf5);
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: rgba(17, 17, 17, 0.96);
            color: white;
            padding: 17px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo span {
            color: #aaa;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-button {
            color: white;
            text-decoration: none;
            background: #292929;
            border: 1px solid #444;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.2s;
        }

        .header-button:hover {
            background: #444;
            transform: translateY(-1px);
        }

        /* =========================
           ANA ALAN
        ========================= */

        main {
            max-width: 850px;
            margin: 0 auto;
            padding: 55px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.5s ease;
        }

        .badge {
            display: inline-block;
            background: white;
            padding: 8px 15px;
            border-radius: 30px;
            color: #666;
            font-size: 13px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .page-title h1 {
            margin: 0 0 10px;
            font-size: 38px;
        }

        .page-title p {
            margin: 0;
            color: #777;
            font-size: 16px;
        }

        /* =========================
           ANI KARTI
        ========================= */

        .memory {
            background: rgba(255, 255, 255, 0.96);
            padding: 28px;
            margin-bottom: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeUp 0.5s ease;
            transition: 0.2s;
        }

        .memory:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        .memory h2 {
            margin: 0 0 8px;
            font-size: 23px;
            line-height: 1.3;
        }

        .author {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .content {
            font-size: 16px;
            line-height: 1.7;
            white-space: pre-wrap;
            margin-bottom: 22px;
            color: #333;
        }

        /* =========================
           BEĞENİ
        ========================= */

        .like-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .like-button {
            background: #111;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .like-button:hover {
            transform: translateY(-1px);
            background: #333;
        }

        .like-button.liked {
            background: #e53950;
        }

        .like-button.liked:hover {
            background: #c9273b;
        }

        .like-count {
            color: #777;
            font-size: 14px;
            background: #f5f5f5;
            padding: 9px 13px;
            border-radius: 9px;
        }

        /* =========================
           YORUMLAR
        ========================= */

        .comments {
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .comments-title {
            font-weight: bold;
            margin-bottom: 14px;
            font-size: 15px;
        }

        .comment-count {
            color: #888;
            font-weight: normal;
        }

        .comment {
            background: #f6f7fa;
            padding: 13px 15px;
            border-radius: 11px;
            margin-bottom: 9px;
            border: 1px solid #eee;
        }

        .comment-author {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
            color: #333;
        }

        .comment-text {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            color: #555;
        }

        .empty-comments {
            color: #999;
            font-size: 14px;
            padding: 5px 0;
        }

        /* =========================
           YORUM FORMU
        ========================= */

        .comment-form {
            display: flex;
            gap: 9px;
            margin-top: 15px;
        }

        .comment-input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            background: #fafafa;
            font-size: 14px;
            transition: 0.2s;
        }

        .comment-input:focus {
            border-color: #222;
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .comment-button {
            background: #111;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .comment-button:hover {
            background: #333;
            transform: translateY(-1px);
        }

        /* =========================
           MESAJ
        ========================= */

        #message {
            text-align: center;
            color: #777;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        /* =========================
           ANİMASYON
        ========================= */

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           TELEFON
        ========================= */

        @media (max-width: 650px) {

            header {
                padding: 15px 18px;
            }

            .logo {
                font-size: 26px;
            }

            .header-button {
                padding: 9px 11px;
                font-size: 13px;
            }

            main {
                padding: 35px 14px;
            }

            .page-title h1 {
                font-size: 30px;
            }

            .page-title p {
                font-size: 14px;
            }

            .memory {
                padding: 21px;
                border-radius: 16px;
            }

            .memory h2 {
                font-size: 20px;
            }

            .content {
                font-size: 15px;
            }

            .comment-form {
                flex-direction: column;
            }

            .comment-button {
                width: 100%;
                padding: 12px;
            }
        }

        @media (max-width: 420px) {

            header {
                flex-direction: column;
                gap: 12px;
            }

            .header-buttons {
                width: 100%;
            }

            .header-button {
                flex: 1;
                text-align: center;
            }
        }
    </style>

</head>

<body>

<header>

    <div class="logo">
        1 <span>ANI</span>
    </div>

    <div class="header-buttons">

        <a
            href="/home.html"
            class="header-button"
        >
            ← Ana Sayfa
        </a>

        <a
            href="/profile.html"
            class="header-button"
        >
            👤 Profilim
        </a>

    </div>

</header>


<main>

    <div class="page-title">

        <div class="badge">
            🌎 Topluluğun anıları
        </div>

        <h1>
            Anıları Keşfet
        </h1>

        <p>
            İnsanların paylaştığı güzel anıları keşfet.
        </p>

    </div>


    <div id="memories">

        <p id="message">
            ✨ Anılar yükleniyor...
        </p>

    </div>

</main>


<script>

// ========================================
// KULLANICI KONTROLÜ
// ========================================

fetch("/api/me")

.then(response => {

    if (!response.ok) {

        window.location.href =
            "/login.html";

        return;

    }

    return response.json();

})

.then(data => {

    if (data) {

        loadMemories();

    }

})

.catch(() => {

    window.location.href =
        "/login.html";

});


// ========================================
// ANILARI YÜKLE
// ========================================

function loadMemories() {

    fetch("/api/memories")

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Anılar alınamadı."
            );

        }

        return response.json();

    })

    .then(memories => {

        const container =
            document.getElementById("memories");

        container.innerHTML = "";

        if (memories.length === 0) {

            container.innerHTML = `

                <p id="message">
                    Henüz hiç anı paylaşılmamış.
                </p>

            `;

            return;
        }


        memories.forEach(memory => {

            const div =
                document.createElement("div");

            div.className = "memory";


            const likedClass =
                memory.liked
                    ? "liked"
                    : "";


            const buttonText =
                memory.liked
                    ? "❤️ Beğenildi"
                    : "❤️ Beğen";


            div.innerHTML = `

                <h2>
                    ${escapeHtml(memory.title)}
                </h2>

                <div class="author">
                    @${escapeHtml(memory.username)}
                </div>

                <div class="content">
                    ${escapeHtml(memory.content)}
                </div>

                <div class="like-area">

                    <button
                        class="like-button ${likedClass}"
                        onclick="likeMemory(${memory.id}, this)"
                    >
                        ${buttonText}
                    </button>

                    <span class="like-count">
                        ❤️ ${memory.like_count}
                    </span>

                </div>


                <div class="comments">

                    <div class="comments-title">

                        💬 Yorumlar

                        <span class="comment-count">
                            (${memory.comment_count})
                        </span>

                    </div>


                    <div id="comments-${memory.id}">
                        <div class="empty-comments">
                            Yorumlar yükleniyor...
                        </div>
                    </div>


                    <div class="comment-form">

                        <input
                            type="text"
                            class="comment-input"
                            id="comment-input-${memory.id}"
                            placeholder="Bu anı hakkında ne düşünüyorsun?"
                            maxlength="1000"
                        >

                        <button
                            class="comment-button"
                            onclick="addComment(${memory.id})"
                        >
                            Gönder
                        </button>

                    </div>

                </div>

            `;


            container.appendChild(div);

            loadComments(memory.id);

        });

    })

    .catch(error => {

        console.error(error);

        document.getElementById("memories").innerHTML = `

            <p id="message">
                ❌ Anılar yüklenirken bir hata oluştu.
            </p>

        `;

    });

}


// ========================================
// BEĞEN / BEĞENME
// ========================================

function likeMemory(memoryId, button) {

    fetch(
        `/api/memories/${memoryId}/like`,
        {
            method: "POST"
        }
    )

    .then(response => {

        if (!response.ok) {
            throw new Error("Beğeni işlemi başarısız.");
        }

        return response.json();

    })

    .then(data => {

        if (data.liked) {

            button.textContent =
                "❤️ Beğenildi";

            button.classList.add("liked");

        } else {

            button.textContent =
                "❤️ Beğen";

            button.classList.remove("liked");

        }


        const count =
            button.nextElementSibling;

        count.textContent =
            `❤️ ${data.likeCount}`;

    })

    .catch(error => {

        console.error(error);

        alert(
            "Beğeni sırasında bir hata oluştu."
        );

    });

}


// ========================================
// YORUMLARI YÜKLE
// ========================================

function loadComments(memoryId) {

    fetch(
        `/api/memories/${memoryId}/comments`
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Yorumlar alınamadı."
            );

        }

        return response.json();

    })

    .then(comments => {

        const container =
            document.getElementById(
                `comments-${memoryId}`
            );


        if (!container) {
            return;
        }


        container.innerHTML = "";


        if (comments.length === 0) {

            container.innerHTML = `

                <div class="empty-comments">
                    Henüz yorum yok. İlk yorumu sen yap!
                </div>

            `;

            return;
        }


        comments.forEach(comment => {

            const div =
                document.createElement("div");

            div.className = "comment";


            div.innerHTML = `

                <div class="comment-author">
                    @${escapeHtml(comment.username)}
                </div>

                <div class="comment-text">
                    ${escapeHtml(comment.content)}
                </div>

            `;


            container.appendChild(div);

        });

    })

    .catch(error => {

        console.error(error);

        const container =
            document.getElementById(
                `comments-${memoryId}`
            );


        if (container) {

            container.innerHTML = `

                <div class="empty-comments">
                    Yorumlar yüklenemedi.
                </div>

            `;

        }

    });

}


// ========================================
// YORUM EKLE
// ========================================

function addComment(memoryId) {

    const input =
        document.getElementById(
            `comment-input-${memoryId}`
        );


    const content =
        input.value.trim();


    if (!content) {

        alert(
            "Lütfen bir yorum yaz."
        );

        return;
    }


    const button =
        input.nextElementSibling;


    button.disabled = true;

    button.textContent = "Gönderiliyor...";


    fetch(
        `/api/memories/${memoryId}/comments`,
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                content: content
            })

        }
    )

    .then(response => response.json())

    .then(data => {

        if (!data.success) {

            alert(
                data.error ||
                "Yorum eklenemedi."
            );

            return;
        }


        input.value = "";

        loadComments(memoryId);


        const memoryElement =
            input.closest(".memory");


        const count =
            memoryElement.querySelector(
                ".comment-count"
            );


        const currentCount =
            parseInt(
                count.textContent
                    .replace(/[()]/g, "")
            ) || 0;


        count.textContent =
            `(${currentCount + 1})`;

    })

    .catch(error => {

        console.error(error);

        alert(
            "Yorum gönderilirken bir hata oluştu."
        );

    })

    .finally(() => {

        button.disabled = false;

        button.textContent = "Gönder";

    });

}


// ========================================
// ENTER İLE YORUM GÖNDER
// ========================================

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            event.target.classList.contains(
                "comment-input"
            )
        ) {

            event.preventDefault();

            const memoryId =
                event.target.id.replace(
                    "comment-input-",
                    ""
                );

            addComment(memoryId);

        }

    }
);


// ========================================
// GÜVENLİ HTML
// ========================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>

</html>
