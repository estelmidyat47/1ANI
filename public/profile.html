<title>1 ANI - Profilim</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #171717;
        background:
            radial-gradient(circle at top left, #e9eef5 0%, transparent 35%),
            linear-gradient(135deg, #f7f8fa, #e9edf2);
        min-height: 100vh;
    }

    header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(17, 17, 17, 0.96);
        backdrop-filter: blur(10px);
        color: white;
        padding: 16px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
    }

    .logo {
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -1px;
    }

    .logo span {
        color: #bfc5cc;
    }

    .nav {
        display: flex;
        gap: 10px;
    }

    .nav a {
        color: white;
        text-decoration: none;
        background: #292929;
        padding: 10px 15px;
        border-radius: 10px;
        font-size: 14px;
        transition: 0.2s;
    }

    .nav a:hover {
        background: #3b3b3b;
        transform: translateY(-1px);
    }

    main {
        width: min(900px, calc(100% - 30px));
        margin: 35px auto 60px;
    }

    .profile-card {
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 24px;
        padding: 35px 25px 28px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        margin-bottom: 30px;
    }

    .profile-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 6px;
        background: #111;
    }

    .avatar {
        width: 96px;
        height: 96px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: #111;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: 800;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
    }

    .username {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .subtitle {
        color: #777;
        margin-top: 7px;
        font-size: 14px;
    }

    .stats {
        max-width: 560px;
        margin: 25px auto 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .stat {
        background: #f5f6f8;
        border: 1px solid #e6e7ea;
        border-radius: 15px;
        padding: 15px 10px;
    }

    .stat-number {
        font-size: 23px;
        font-weight: 800;
    }

    .stat-label {
        margin-top: 4px;
        color: #777;
        font-size: 12px;
    }

    .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 0 18px;
    }

    .section-title h1 {
        margin: 0;
        font-size: 25px;
        letter-spacing: -0.5px;
    }

    .section-title span {
        color: #777;
        font-size: 13px;
    }

    .memory {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(0, 0, 0, 0.06);
        padding: 25px;
        margin-bottom: 18px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        transition: 0.2s;
    }

    .memory:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.09);
    }

    .memory h2 {
        margin: 0 0 12px;
        font-size: 21px;
        word-break: break-word;
    }

    .content {
        line-height: 1.7;
        white-space: pre-wrap;
        color: #444;
        margin-bottom: 18px;
        word-break: break-word;
    }

    .date {
        color: #888;
        font-size: 13px;
        padding-top: 14px;
        border-top: 1px solid #eee;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 18px;
    }

    .edit-button,
    .delete-button {
        flex: 1;
        border: none;
        padding: 12px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: 0.2s;
    }

    .edit-button {
        background: #111;
        color: white;
    }

    .edit-button:hover {
        background: #333;
        transform: translateY(-1px);
    }

    .delete-button {
        background: #f0f0f0;
        color: #a00018;
    }

    .delete-button:hover {
        background: #ffe6e9;
        transform: translateY(-1px);
    }

    .empty {
        background: rgba(255, 255, 255, 0.9);
        border: 1px dashed #cfd2d7;
        border-radius: 18px;
        padding: 45px 20px;
        text-align: center;
        color: #777;
    }

    .empty-icon {
        font-size: 38px;
        margin-bottom: 10px;
    }

    #message {
        text-align: center;
        color: #777;
    }

    @media (max-width: 600px) {

        header {
            padding: 14px 16px;
        }

        .logo {
            font-size: 23px;
        }

        .nav a {
            padding: 9px 10px;
            font-size: 12px;
        }

        main {
            width: min(100% - 20px, 900px);
            margin: 20px auto 40px;
        }

        .profile-card {
            padding: 30px 15px 22px;
            border-radius: 20px;
        }

        .avatar {
            width: 82px;
            height: 82px;
            font-size: 34px;
        }

        .username {
            font-size: 24px;
        }

        .stats {
            gap: 7px;
        }

        .stat {
            padding: 12px 5px;
        }

        .stat-number {
            font-size: 20px;
        }

        .stat-label {
            font-size: 11px;
        }

        .section-title h1 {
            font-size: 21px;
        }

        .memory {
            padding: 20px;
            border-radius: 16px;
        }

        .buttons {
            flex-direction: column;
        }

        .edit-button,
        .delete-button {
            width: 100%;
        }
    }
</style>

<script>

// ========================================
// PROFİLİ YÜKLE
// ========================================

fetch("/api/me")

.then(response => {

    if (!response.ok) {

        window.location.href = "/login.html";

        return;
    }

    return response.json();

})

.then(user => {

    if (!user) {
        return;
    }

    document.getElementById("username").textContent =
        "@" + user.username;

    document.getElementById("avatar").textContent =
        user.username.charAt(0).toUpperCase();

    loadMyMemories(user.username);

})

.catch(error => {

    console.error(error);

    window.location.href = "/login.html";

});


// ========================================
// KULLANICININ ANILARINI GETİR
// ========================================

function loadMyMemories(username) {

    fetch("/api/memories")

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Anılar alınamadı."
            );

        }

        return response.json();

    })

    .then(memories => {

        const container =
            document.getElementById("memories");

        container.innerHTML = "";

        const myMemories =
            memories.filter(
                memory =>
                    memory.username === username
            );


        // ========================================
        // İSTATİSTİKLER
        // ========================================

        const totalLikes =
            myMemories.reduce(
                (total, memory) =>
                    total + Number(memory.like_count || 0),
                0
            );

        const totalComments =
            myMemories.reduce(
                (total, memory) =>
                    total + Number(memory.comment_count || 0),
                0
            );


        document.getElementById("memoryCount")
            .textContent = myMemories.length;

        document.getElementById("likeCount")
            .textContent = totalLikes;

        document.getElementById("commentCount")
            .textContent = totalComments;


        document.getElementById("memoryInfo")
            .textContent =
                myMemories.length === 0
                    ? "Henüz anı yok"
                    : myMemories.length + " anı";


        // ========================================
        // HİÇ ANI YOKSA
        // ========================================

        if (myMemories.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        💭
                    </div>

                    <strong>
                        Henüz hiç anı paylaşmadın.
                    </strong>

                    <p>
                        İlk anını paylaşarak burada
                        güzel bir iz bırakabilirsin.
                    </p>

                    <a
                        href="/home.html"
                        style="
                            display:inline-block;
                            margin-top:10px;
                            background:#111;
                            color:white;
                            padding:11px 17px;
                            border-radius:10px;
                            text-decoration:none;
                            font-size:14px;
                        "
                    >
                        ✨ İlk Anımı Paylaş
                    </a>

                </div>

            `;

            return;
        }


        // ========================================
        // ANILARI GÖSTER
        // ========================================

        myMemories.forEach(memory => {

            const div =
                document.createElement("div");

            div.className = "memory";


            const date =
                new Date(memory.created_at);


            div.innerHTML = `

                <h2>
                    ${escapeHtml(memory.title)}
                </h2>

                <div class="content">
                    ${escapeHtml(memory.content)}
                </div>

                <div class="date">

                    📅 ${date.toLocaleString("tr-TR")}

                    &nbsp; • &nbsp;

                    ❤️ ${memory.like_count}

                    &nbsp; • &nbsp;

                    💬 ${memory.comment_count}

                </div>


                <div class="buttons">

                    <button
                        class="edit-button"
                        type="button"
                    >
                        ✏️ Anıyı Düzenle
                    </button>


                    <button
                        class="delete-button"
                        type="button"
                    >
                        🗑️ Anıyı Sil
                    </button>

                </div>

            `;


            // ========================================
            // DÜZENLE
            // ========================================

            const editButton =
                div.querySelector(
                    ".edit-button"
                );

            editButton.addEventListener(
                "click",
                function () {

                    editMemory(
                        memory.id,
                        memory.title,
                        memory.content
                    );

                }
            );


            // ========================================
            // SİL
            // ========================================

            const deleteButton =
                div.querySelector(
                    ".delete-button"
                );

            deleteButton.addEventListener(
                "click",
                function () {

                    deleteMemory(
                        memory.id
                    );

                }
            );


            container.appendChild(div);

        });

    })

    .catch(error => {

        console.error(error);

        document.getElementById("memories")
            .innerHTML = `

                <div class="empty">

                    ❌ Anılar yüklenirken
                    bir hata oluştu.

                </div>

            `;

    });

}


// ========================================
// ANI DÜZENLE
// ========================================

function editMemory(
    memoryId,
    oldTitle,
    oldContent
) {

    const newTitle =
        prompt(
            "Anının başlığını düzenle:",
            oldTitle
        );


    if (newTitle === null) {
        return;
    }


    const newContent =
        prompt(
            "Anının içeriğini düzenle:",
            oldContent
        );


    if (newContent === null) {
        return;
    }


    if (!newTitle.trim()) {

        alert(
            "Başlık boş bırakılamaz."
        );

        return;
    }


    if (!newContent.trim()) {

        alert(
            "Anı boş bırakılamaz."
        );

        return;
    }


    fetch(
        "/api/memories/" + memoryId,
        {
            method: "PUT",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                title: newTitle.trim(),
                content: newContent.trim()
            })
        }
    )

    .then(response => {

        return response.json();

    })

    .then(data => {

        if (!data.success) {

            alert(
                data.error ||
                "Anı düzenlenemedi."
            );

            return;
        }


        alert(
            "✅ Anın başarıyla düzenlendi."
        );


        loadMyMemories(
            document
                .getElementById("username")
                .textContent
                .replace("@", "")
        );

    })

    .catch(error => {

        console.error(error);

        alert(
            "Anı düzenlenirken bir hata oluştu."
        );

    });

}


// ========================================
// ANI SİL
// ========================================

function deleteMemory(memoryId) {

    const confirmDelete =
        confirm(
            "Bu anıyı silmek istediğine emin misin?\n\n" +
            "Anıyla birlikte beğeniler ve yorumlar da silinecek."
        );


    if (!confirmDelete) {
        return;
    }


    fetch(
        "/api/memories/" + memoryId,
        {
            method: "DELETE"
        }
    )

    .then(response => {

        return response.json();

    })

    .then(data => {

        if (!data.success) {

            alert(
                data.error ||
                "Anı silinemedi."
            );

            return;
        }


        alert(
            "✅ Anı başarıyla silindi."
        );


        loadMyMemories(
            document
                .getElementById("username")
                .textContent
                .replace("@", "")
        );

    })

    .catch(error => {

        console.error(error);

        alert(
            "Anı silinirken bir hata oluştu."
        );

    });

}


// ========================================
// GÜVENLİ HTML
// ========================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>
