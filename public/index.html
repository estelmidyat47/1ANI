```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 ANI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .buttons button {
            padding: 10px 18px;
            margin-left: 8px;
            border: 1px solid #222;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        .buttons .register {
            background: #222;
            color: white;
        }

        main {
            max-width: 900px;
            margin: 90px auto;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }

        .quote {
            font-size: 28px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .description {
            font-size: 19px;
            color: #666;
            line-height: 1.7;
            max-width: 650px;
            margin: 0 auto 30px;
        }

        .small-text {
            font-size: 17px;
            color: #888;
            margin-bottom: 30px;
        }

        .start-button {
            padding: 15px 30px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .start-button:hover,
        .buttons button:hover {
            opacity: 0.85;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 23px;
            }

            .buttons button {
                padding: 8px 12px;
                font-size: 13px;
            }

            main {
                margin: 60px auto;
            }

            h1 {
                font-size: 45px;
            }

            .quote {
                font-size: 23px;
            }

            .description {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">1 ANI</div>

        <div class="buttons">
            <button onclick="window.location.href='/login.html'">
                Giriş Yap
            </button>

            <button
                class="register"
                onclick="window.location.href='/register.html'">
                Kayıt Ol
            </button>
        </div>
    </header>

    <main>
        <h1>1 ANI</h1>

        <p class="quote">
            “Bazı anılar vardır, üzerinden yıllar geçse bile
            ilk günkü gibi hatırlanır.”
        </p>

        <p class="description">
            Yaşadığın anları paylaş.
            Güzel anılarını burada sakla ve zaman geçse bile
            tekrar hatırlayabil.
        </p>

        <p class="small-text">
            Unutulmasın. Bir yerde hep seninle kalsın. ❤️
        </p>

        <button
            class="start-button"
            onclick="window.location.href='/register.html'">
            Anını Paylaş
        </button>
    </main>

</body>
</html>
